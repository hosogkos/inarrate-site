<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Admin | Forms</title>
  <link rel="stylesheet" href="/style.css" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">Inarrate</a>
      <nav class="nav">
        <a href="/">HOME</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <h1>管理者ページ（フォーム一覧）</h1>
    <p class="hint">このページは管理者トークン必須。</p>

    <div id="locked" style="display:none;">
      <h2>アクセス不可</h2>
      <p>URLに <code>?admin=...</code> が必要。</p>
    </div>

    <div id="ok" style="display:none;">
      <h2>リンク一覧</h2>
      <ul id="links"></ul>
      <p class="hint">各リンクは <code>type</code> と <code>t</code> を含む。</p>
    </div>
  </main>

  <script src="/form/admin.js"></script>
</body>
</html>
